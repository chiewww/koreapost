name: Daily Korea Post check

on:
  schedule:
    - cron: "0 21 * * *"   # every day 21:00 UTC (06:00 in Korea)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright deep-translator
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scrape_korea.py

      - name: Upload debug page on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-page
          path: debug_page.html
          if-no-files-found: ignore

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output_korea.txt translation_cache.json
          git diff --staged --quiet || git commit -m "Update output_korea.txt"
          git push
