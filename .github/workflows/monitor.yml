
name: Korea Post Daily Monitor

on:
  schedule:
    # Daily at 06:15 UTC
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: koreapost-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Generate Korea Post report
        run: python monitor_korea.py

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-korea
          path: output_korea.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Commit updated report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output_korea.txt

          if git diff --cached --quiet; then
            echo "The report has not changed."
          else
            git commit -m "Update Korea Post monitoring report"
            git push
          fi
